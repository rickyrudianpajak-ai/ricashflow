<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="Pencatat keuangan pribadi yang tersambung ke Google Sheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RicashFlow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}</style>
<title>RicashFlow</title>
<style>
/* Layout: mobile = satu kolom + tab bar bawah + FAB; desktop (>=960px) = sidebar kiri + grid konten 2 kolom.
   Warna: lima pastel dari brief + tinta gelap per pastel untuk teks/ikon agar tetap terbaca. */
:root{
  --bg:#F9F9F9; --surface:#FFFFFF; --surface-2:#F3F3F6;
  --ink:#262836; --ink-2:#5C5F72; --ink-3:#9497A8; --line:#EBEBF0;
  --mint:#E3F7E8; --mint-ink:#1E8A3A; --mint-mid:#34C759;
  --pink:#FFEFD9; --pink-ink:#BF5A00; --pink-mid:#FF9500;
  --lav:#F1E6FA;  --lav-ink:#8A3FB0;  --lav-mid:#AF52DE;
  --blue:#DCEBFF; --blue-ink:#0A63D1; --blue-mid:#3395FF;
  --warn:#D70015; --warn-bg:#FFE5E3; --red-mid:#FF3B30;
  --red-ink:#D70015; --red-bg:#FFE5E3;
  --r-sm:12px; --r:16px; --r-lg:20px; --r-xl:24px;
  --shadow:0 1px 2px rgba(38,40,54,.04),0 8px 24px -12px rgba(38,40,54,.12);
  --shadow-lg:0 24px 60px -20px rgba(38,40,54,.35);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tab-h:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--blue-ink);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.pos{color:var(--mint-ink)} .neg{color:var(--pink-ink)}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
main{flex:1;min-width:0;padding:0 16px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto;width:100%}
.view{display:flex;flex-direction:column;gap:18px;padding-top:14px;animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;gap:12px;padding-top:6px}
.topbar .grow{flex:1;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--blue-ink);background:radial-gradient(circle at 30% 25%,#fff 0 18%,transparent 19%),linear-gradient(140deg,var(--blue),var(--lav));box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--line)}
.hello-sub{font-size:13px;color:var(--ink-3);font-weight:600}
.hello{font-size:24px;line-height:1.15}
.page-title{font-size:26px}
.pill-select{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px 8px 14px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}
.pill-select select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pill-select svg.i{width:16px;height:16px;color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}

.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(235,235,240,.7);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px}
.link{font-weight:700;font-size:13px;color:var(--blue-ink);display:inline-flex;align-items:center;gap:2px}
.link svg.i{width:16px;height:16px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px 18px;background:
  radial-gradient(120% 90% at 100% 0%,var(--lav) 0,transparent 55%),
  radial-gradient(90% 80% at 0% 100%,var(--mint) 0,transparent 60%),
  linear-gradient(160deg,var(--blue) 0%,#E8F1FF 60%,#F4F8FF 100%);
  box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.35)}
.hero-label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--blue-ink)}
.hero-amt{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,46px);letter-spacing:-.025em;line-height:1.05;margin:8px 0 4px;position:relative;z-index:1}
.hero-amt .rp{font-size:.5em;font-weight:700;margin-right:4px;vertical-align:.55em;color:var(--ink-2)}
.hero-note{font-size:12.5px;color:var(--ink-2);position:relative;z-index:1}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:1}
.hero-chip{background:rgba(255,255,255,.66);backdrop-filter:blur(6px);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.hero-chip .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero-chip .dot svg.i{width:17px;height:17px}
.hero-chip small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.hero-chip b{font-size:15px;font-weight:800;white-space:nowrap}

/* ---------- wallets ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wallet{scroll-snap-align:start;flex:0 0 156px;border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:14px;text-align:left;position:relative;overflow:hidden;transition:transform .15s}
.wallet:hover{transform:translateY(-2px)}
.wallet .w-ic{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.wallet .w-name{font-weight:700;font-size:13.5px}
.wallet .w-amt{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.wallet .w-tag{font-size:11px;font-weight:700;opacity:.75}
.t-bank{background:var(--blue);color:var(--blue-ink)} .t-bank .w-amt,.t-bank .w-name{color:var(--ink)}
.t-save{background:var(--lav);color:var(--lav-ink)} .t-save .w-amt,.t-save .w-name{color:var(--ink)}
.wallet.empty{background:var(--surface);border:1.5px dashed var(--line);color:var(--ink-3);justify-content:center;align-items:flex-start}

/* ---------- budget meter ---------- */
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--pink-mid);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.over i{background:var(--red-mid)}
.meter.mint i{background:var(--mint-mid)} .meter.lav i{background:var(--lav-mid)} .meter.blue i{background:var(--blue-mid)}
.budget-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.big-num{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kv span{background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kv b{color:var(--ink)}

/* ---------- donut ---------- */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c small{font-size:11px;color:var(--ink-3);font-weight:700}
.donut .c b{font-family:var(--f-display);font-size:19px;font-weight:800}
.legend{display:flex;flex-direction:column;gap:4px;min-width:0}
.legend button{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:12px;text-align:left;min-width:0}
.legend button:hover{background:var(--surface-2)}
.legend .sw{width:10px;height:10px;border-radius:4px;flex:none}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;font-weight:600}
.legend .pc{font-size:12px;color:var(--ink-3);font-weight:700;width:36px;text-align:right}
.legend .am{font-size:13px;font-weight:700;width:68px;text-align:right}

/* ---------- insights ---------- */
.insights{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.insights::-webkit-scrollbar{display:none}
.ins{scroll-snap-align:start;flex:0 0 250px;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.ins .ins-ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center}
.ins .ins-ic svg.i{width:18px;height:18px}
.ins p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.ins p b{font-weight:800}
.ins .ins-k{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tone-mint{background:var(--mint)} .tone-mint .ins-k,.tone-mint .ins-ic{color:var(--mint-ink)}
.tone-pink{background:var(--pink)} .tone-pink .ins-k,.tone-pink .ins-ic{color:var(--pink-ink)}
.tone-lav{background:var(--lav)} .tone-lav .ins-k,.tone-lav .ins-ic{color:var(--lav-ink)}
.tone-blue{background:var(--blue)} .tone-blue .ins-k,.tone-blue .ins-ic{color:var(--blue-ink)}
.tone-warn{background:var(--warn-bg)} .tone-warn .ins-k,.tone-warn .ins-ic{color:var(--warn)}

/* ---------- transaction rows ---------- */
.tx-list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 6px;margin:0 -6px;border-radius:var(--r);text-align:left;width:calc(100% + 12px)}
.tx:hover{background:var(--surface-2)}
.bub{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.bub svg.i{width:21px;height:21px}
.b-in{background:var(--mint);color:var(--mint-ink)}
.b-out{background:var(--pink);color:var(--pink-ink)}
.b-save{background:var(--lav);color:var(--lav-ink)}
.b-trf{background:var(--blue);color:var(--blue-ink)}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:800;font-size:14.5px;white-space:nowrap;text-align:right}
.tx .amt small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.amt.in{color:var(--mint-ink)} .amt.trf{color:var(--blue-ink)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:1}
.day-h b{font-size:13px;font-weight:800}
.day-h span{font-size:12px;color:var(--ink-3);font-weight:600}
.empty-state{padding:28px 10px;text-align:center;color:var(--ink-3);font-size:14px}
.empty-state .bub{margin:0 auto 10px;background:var(--surface-2);color:var(--ink-3)}

/* ---------- history / analysis ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;position:relative}
.seg button{flex:1;min-width:0;padding:9px 4px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);position:relative;z-index:1;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--surface);box-shadow:0 2px 8px -2px rgba(38,40,54,.18);transition:left .28s cubic-bezier(.3,.9,.3,1),width .28s,background .25s}
.seg.small button{padding:6px 10px;font-size:12px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum3 div{border-radius:var(--r);padding:12px;min-width:0}
.sum3 small{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.sum3 b{display:block;font-family:var(--f-display);font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:relative;width:100%;height:220px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%}
.chart text{font-family:var(--f-body);font-size:10.5px;fill:var(--ink-3);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:var(--shadow-lg);z-index:2}
.tip b{font-weight:800}
.tip .k{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
.chart-legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--ink-2);margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:4px}
.chart-legend .ln{width:14px;height:3px;border-radius:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r);padding:0 12px;height:44px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:14px}
.search svg.i{color:var(--ink-3);width:18px;height:18px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.chip svg.i{width:15px;height:15px}

/* ---------- budget page ---------- */
.b-group{display:flex;flex-direction:column;gap:14px}
.b-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.b-row .bub{width:40px;height:40px}
.b-row .bub svg.i{width:19px;height:19px}
.b-line{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.b-line b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-line span{white-space:nowrap;font-weight:600;color:var(--ink-2);font-size:12.5px}
.b-foot{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:4px}
.b-foot.over{color:var(--warn)}
.rep-col{display:flex;flex-direction:column;gap:inherit;min-width:0}
.bd-ctrl{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bd-ctrl .seg:first-child{flex:1}
.bd-tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.bd-tot b{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--ink)}
.bd-row .meter{height:10px}
.chart-legend .sq{width:10px;height:10px;border-radius:4px;display:inline-block}
.sub-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 -4px}

/* ---------- accounts page ---------- */
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px;margin:12px 0 10px}
.stack i{display:block;height:100%;border-radius:4px}
.acc-grid{display:grid;grid-template-columns:1fr;gap:12px}
.acc{display:flex;flex-direction:column;gap:12px}
.acc-top{display:flex;align-items:center;gap:12px}
.acc-top .mid{flex:1;min-width:0}
.acc-top .nm{font-weight:800;font-size:15px}
.acc-top .tg{font-size:12px;color:var(--ink-3);font-weight:600}
.acc-top .sal{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap}
.acc-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acc-flow div{background:var(--surface-2);border-radius:12px;padding:8px;min-width:0}
.acc-flow small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.acc-flow b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{height:42px;width:100%}
.spark svg{width:100%;height:100%;display:block}

/* ---------- tab bar + FAB ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);border-radius:14px}
.tabbar button .tb{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .tb{background:var(--blue);color:var(--blue-ink)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));z-index:21;width:62px;height:62px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;box-shadow:0 14px 28px -10px rgba(0,98,204,.55),inset 0 0 0 3px rgba(255,255,255,.6);transition:transform .2s}
.fab:hover{transform:scale(1.06) rotate(90deg)}
.fab svg.i{width:28px;height:28px;stroke-width:2.6}

/* ---------- sheets (form / detail) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(38,40,54,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:94%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.3,.9,.3,1);box-shadow:var(--shadow-lg)}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#D9D9E0;margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;flex:none}
.sheet-h h2{font-size:20px}
.sheet-b{overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}

.type-seg button[aria-pressed="true"]{color:var(--ink)}
.amount-box{border-radius:var(--r-xl);padding:16px 18px 14px;transition:background .25s}
.amount-box label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.amount-line{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.amount-line .rp{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--ink-2)}
.amount-line input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f-display);font-weight:800;font-size:40px;transition:font-size .15s;letter-spacing:-.02em;padding:0}
.amount-line input::placeholder{color:rgba(38,40,54,.25)}
.amount-calc{font-size:13px;font-weight:700;color:var(--ink-2);min-height:19px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{background:rgba(255,255,255,.7);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700}
.quick button.op{width:34px;padding:6px 0;text-align:center}
.field-l{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.field-l span{font-weight:600;color:var(--ink-3);font-size:12px}
.acc-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.acc-chips::-webkit-scrollbar{display:none}
.acc-chip{flex:none;display:flex;align-items:center;gap:8px;border-radius:var(--r);padding:8px 12px 8px 8px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.acc-chip .bub{width:30px;height:30px}
.acc-chip .bub svg.i{width:16px;height:16px}
.acc-chip b{display:block;font-size:13px}
.acc-chip small{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.acc-chip[aria-pressed="true"]{border-color:var(--blue-ink);background:#EAF3FF}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;border-radius:var(--r);min-width:0}
.cat .bub{width:52px;height:52px;transition:transform .15s,box-shadow .15s}
.cat .bub svg.i{width:23px;height:23px}
.cat>span:last-child{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat:hover .bub{transform:translateY(-2px)}
.cat[aria-pressed="true"] .bub{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor;transform:scale(1.04)}
.cat[aria-pressed="true"]>span:last-child{color:var(--ink);font-weight:800}
.cat.more .bub{background:var(--surface-2);color:var(--ink-2)}
.cat-group-h{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.date-row{display:flex;gap:8px;align-items:stretch}
.date-field{position:relative;flex:1 1 auto;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;height:50px;font-weight:700;font-size:14px;min-width:0}
.date-field svg.i{color:var(--blue-ink)}
.date-field{text-align:left;cursor:pointer}
.date-field #dateTxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.date-field .caret{width:16px;height:16px;color:var(--ink-3);transition:transform .2s}
.date-field[aria-expanded="true"]{border-color:var(--blue-ink)}
.date-field[aria-expanded="true"] .caret{transform:rotate(180deg)}
.date-row .chip{height:50px;border-radius:var(--r);padding:0 12px;flex:none}
.text-field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;height:50px;font-size:14px;outline:none}
.text-field:focus{border-color:var(--blue-ink)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.btn-primary{width:100%;height:56px;border-radius:var(--r-lg);background:var(--blue);color:var(--blue-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 24px -14px rgba(0,98,204,.7),inset 0 -3px 0 rgba(0,98,204,.12);transition:transform .12s,filter .2s}
.btn-primary:hover{filter:brightness(.97)}
.btn-primary:active{transform:scale(.985)}
.btn-primary[disabled]{opacity:.6;cursor:progress}
.btn-ghost{height:48px;border-radius:var(--r);padding:0 16px;font-weight:700;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-danger{background:var(--warn-bg);color:var(--warn)}
.form-err{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:13px;font-weight:700}

.detail-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 4px}
.detail-hero .bub{width:64px;height:64px}
.detail-hero .bub svg.i{width:30px;height:30px}
.detail-hero .amt{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;background:var(--surface);border-radius:var(--r-lg);padding:16px;font-size:14px}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:60;background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);transition:all .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--blue);font-weight:800}
.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--mint-ink);flex:none;box-shadow:0 0 0 3px var(--mint)}
.status.demo .led{background:#FF9500;box-shadow:0 0 0 3px #FFE9C7}
.skeleton{border-radius:var(--r-lg);background:linear-gradient(90deg,#EFEFF3 0,#F7F7FA 50%,#EFEFF3 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- responsive ---------- */
@media (min-width:640px){
  .acc-grid{grid-template-columns:1fr 1fr}
  .cat-grid{grid-template-columns:repeat(5,1fr)}
  .sheet{left:50%;right:auto;bottom:50%;width:min(560px,calc(100% - 48px));border-radius:var(--r-xl);transform:translate(-50%,calc(50% + 40px)) scale(.97);opacity:0;max-height:min(860px,calc(100% - 48px));transition:transform .3s cubic-bezier(.3,.9,.3,1),opacity .2s;pointer-events:none}
  .sheet.open{transform:translate(-50%,50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
  .sheet-h{padding-top:18px}
}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;width:252px;flex:none;padding:26px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;padding:0 8px}
  .brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--mint),var(--blue),var(--lav),var(--pink),var(--mint));color:var(--ink)}
  .brand-mark svg.i{width:19px;height:19px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--ink-2);text-align:left}
  .side nav button:hover{background:var(--surface-2)}
  .side nav button[aria-current="page"]{background:var(--blue);color:var(--blue-ink)}
  .side .btn-primary{height:50px;font-size:15px}
  .side .spacer{flex:1}
  .tabbar{display:none}
  .fab{bottom:28px;right:28px}
  .toast{bottom:32px}
  main{padding:8px 32px 48px}
  .view{gap:22px;padding-top:22px}
  .hello{font-size:30px}
  .page-title{font-size:30px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
  .home-grid .span2{grid-column:1/-1}
  .hist-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
  .hist-grid .sticky{position:sticky;top:22px;display:flex;flex-direction:column;gap:22px}
  .budget-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .acc-grid{grid-template-columns:repeat(3,1fr)}
  .hscroll,.insights{margin:0;padding:2px 0 8px}
  .insights{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
  .ins{flex:auto}
  .chart{height:260px}
}
@media (max-width:960px){ .home-grid,.hist-grid,.budget-grid{display:flex;flex-direction:column;gap:18px} .hist-grid .sticky{display:flex;flex-direction:column;gap:18px} }
@media (max-width:560px){ .donut-wrap{grid-template-columns:1fr;justify-items:center} .legend{width:100%} }
@media (max-width:380px){ .cat-grid{grid-template-columns:repeat(3,1fr)} .acc-flow{grid-template-columns:1fr 1fr} }
@media (min-width:960px){.m-only{display:none}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.fact .bub{width:40px;height:40px}
.fact .bub svg.i{width:19px;height:19px}
.fact small{display:block;font-size:12px;font-weight:600;color:var(--ink-3)}
.fact .fv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fact .fv b{font-size:15px;font-weight:800}
.fact .fv span{font-size:12px;color:var(--ink-2);font-weight:600}
@media (min-width:960px){.ins-area{grid-row:span 2}}

/* ---------- mutasi rekening ---------- */
article.card.acc[data-acc]{cursor:pointer;transition:transform .15s,box-shadow .15s}
article.card.acc[data-acc]:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(38,40,54,.05),0 14px 30px -14px rgba(38,40,54,.22)}
.acc-more{align-self:flex-end;margin-top:-4px}
.acc-hero{border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.acc-hero::after{content:"";position:absolute;right:-50px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.35)}
.acc-hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.acc-hero .ins-ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.75);display:grid;place-items:center}
.acc-period{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.acc-period>div{background:rgba(255,255,255,.66);border-radius:var(--r-sm);padding:8px 11px}
.acc-period small{display:block;font-size:11px;font-weight:700;color:var(--ink-2)}
.acc-period b{font-size:14px;font-weight:800}
.acc-period svg.i{width:16px;height:16px;color:var(--ink-2)}
.acc-period .delta{background:none;padding:0;font-weight:800;font-size:13.5px;color:var(--warn)}
.acc-period .delta.pos{color:var(--mint-ink)}
.dl .link{font-size:14px;display:inline-flex}
@media (max-width:960px){ .acc-layout .sticky{display:contents} .acc-layout .o-list{order:4} .acc-layout .o-flows{order:5} }

/* ---------- kalender ---------- */
.cal{margin-top:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);animation:viewIn .2s ease both}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:var(--f-display);font-size:16px}
.cal-h .icon-btn{width:36px;height:36px;box-shadow:none}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w span{font-size:11px;font-weight:800;color:var(--ink-3);padding:4px 0;letter-spacing:.04em}
.cal-w span:last-child{color:var(--pink-ink)}
.cal-d{position:relative;aspect-ratio:1;max-height:44px;border-radius:12px;font-weight:700;font-size:14px;display:grid;place-items:center;color:var(--ink)}
.cal-d:hover{background:var(--surface-2)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--blue-ink);color:var(--blue-ink)}
.cal-d.has::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--pink-ink);opacity:.7}
.cal-d[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);box-shadow:none}
.cal-d[aria-pressed="true"]::after{background:var(--blue-ink)}
.cal-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.cal-f span{display:inline-flex;align-items:center;gap:6px}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--pink-ink);opacity:.7;display:inline-block}

/* ---------- input cepat rutin ---------- */
.rt-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px;scroll-padding-inline:18px;scroll-snap-type:x proximity}
.rt-row::-webkit-scrollbar{display:none}
.rt-chip{position:relative;flex:0 0 164px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px;transition:border-color .15s,transform .15s}
.rt-chip:hover{transform:translateY(-1px)}
.rt-chip .bub{width:36px;height:36px}
.rt-chip .bub svg.i{width:18px;height:18px}
.rt-t{display:flex;flex-direction:column;min-width:0;width:100%}
.rt-t b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-t small{font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-a{font-size:13.5px;font-weight:800;margin-top:4px}
.rt-chip[aria-pressed="true"]{border-color:var(--blue-ink);background:#EAF3FF}
.rt-chip.done{background:var(--surface-2);border-style:dashed}
.rt-chip.done .rt-a{color:var(--ink-3)}
.rt-done{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center}
.rt-done svg.i{width:13px;height:13px;stroke-width:3}
.rt-all{background:var(--blue);border-color:transparent;color:var(--blue-ink)}
.rt-all .bub{background:rgba(255,255,255,.7);color:var(--blue-ink)}
.rt-all .rt-t small{color:var(--blue-ink);opacity:.8;white-space:normal}

/* ---------- batch rutin ---------- */
.bt-list{display:flex;flex-direction:column;gap:8px}
.bt-row{display:grid;grid-template-columns:auto 40px minmax(0,1fr) 128px;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;transition:border-color .15s,background .15s}
.bt-row.on{border-color:var(--blue-mid);background:#F0F6FF}
.bt-row .bub{width:40px;height:40px}
.bt-row .bub svg.i{width:19px;height:19px}
.bt-check{position:relative;width:26px;height:26px;cursor:pointer}
.bt-check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.bt-check .box{width:26px;height:26px;border-radius:9px;border:2px solid #CFD0DA;display:grid;place-items:center;color:transparent;background:var(--surface);transition:all .15s}
.bt-check input:checked+.box{background:var(--blue);border-color:var(--blue-ink);color:var(--blue-ink)}
.bt-check input:focus-visible+.box{outline:2.5px solid var(--blue-ink);outline-offset:2px}
.bt-check .box svg.i{width:15px;height:15px;stroke-width:3}
.bt-t{display:flex;flex-direction:column;min-width:0}
.bt-t b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-t small{font-size:11.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.bt-t small svg.i{width:12px;height:12px;stroke-width:3}
.bt-amt{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:0 10px;height:40px}
.bt-amt span{font-size:12px;font-weight:700;color:var(--ink-3)}
.bt-amt input{border:0;background:none;outline:none;width:100%;min-width:0;font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.batch-sum{display:flex;gap:12px;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
@media (max-width:440px){ .bt-row{grid-template-columns:auto 36px minmax(0,1fr)} .bt-row .bub{width:36px;height:36px} .bt-amt{grid-column:2/-1} }

/* ---------- titipan ---------- */
.seg.small[data-seg="sub"] button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg.small[data-seg="sub"] svg.i{width:15px;height:15px}
.arah{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arah-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px}

.arah-btn .bub svg.i{width:18px;height:18px}

.arah-btn small{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.35}

.tit-note{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--lav-ink);background:var(--lav);border-radius:10px;padding:6px 10px}

.tit-head .caret{width:16px;height:16px;color:var(--ink-3);transition:transform .2s}
.tit-head[aria-expanded="true"] .caret{transform:rotate(180deg)}
.tit-list{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px}
.tit-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.tit-row b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.icon-btn.sm{width:34px;height:34px;box-shadow:none}

/* ---------- estimasi & uang harian ---------- */

.ms{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:var(--r);padding:12px;background:var(--surface-2);min-width:0}

.ms-l svg.i{width:15px;height:15px}
.ms b{font-family:var(--f-display);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms small{font-size:11.5px;font-weight:600;color:var(--ink-3);line-height:1.35}
.ms-warn{background:var(--warn-bg)} .ms-warn .ms-l,.ms-warn b{color:var(--warn)}

.meter.sm{height:8px}

.proj{border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.proj-neg{background:linear-gradient(160deg,var(--warn-bg),#FFF1F0)} .proj-pos{background:linear-gradient(160deg,var(--mint),#EEFAF1)}

.proj-neg .ins-ic,.proj-neg .ins-k,.proj-neg .proj-amt{color:var(--warn)} .proj-pos .ins-ic,.proj-pos .ins-k,.proj-pos .proj-amt{color:var(--mint-ink)}

.pe{border-bottom:1px solid var(--line);font-size:13.5px}

.pe summary{cursor:pointer;list-style:none}
.pe summary::-webkit-details-marker{display:none}
.pe summary span::after{content:" ▾";color:var(--ink-3);font-size:11px}
.pe[open] summary span::after{content:" ▴"}
.pe span{color:var(--ink-2);font-weight:600}
.pe b{font-weight:800;white-space:nowrap;color:var(--ink)}
.pe b.pos{color:var(--mint-ink)}
.pe.total b{color:inherit}
.proj-neg .pe.total{color:var(--warn)} .proj-pos .pe.total{color:var(--mint-ink)}
.pe ul{list-style:none;margin:0 0 10px;padding:8px 10px;background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.pe li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.pe li b{font-weight:700}
.pe.total span{color:var(--ink);font-weight:800}

/* ---------- PWA ---------- */
.connect{min-height:70vh;display:grid;place-items:center}
.connect-card{max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;padding:24px}
.connect-card p{margin:0;font-size:14px}
.connect-card code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
.connect-form{display:flex;flex-direction:column}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--mint),var(--blue),var(--lav),var(--pink),var(--mint));color:var(--ink);flex:none}
.brand-mark.lg{width:56px;height:56px;border-radius:18px}
.brand-mark.lg svg.i{width:28px;height:28px}
.install-btn{width:100%;margin-top:4px;background:var(--blue);color:var(--blue-ink)}
.install-banner{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1.5px solid var(--blue-mid);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow);color:var(--blue-ink)}
.install-banner b{display:block;color:var(--ink);font-size:14px}
.install-banner small{display:block;color:var(--ink-3);font-size:12px;font-weight:600}
@media (min-width:960px){.install-banner.m-only{display:none}}
body.connecting .tabbar,body.connecting .fab,body.connecting .side nav,body.connecting .side>.btn-primary{display:none}
body.connecting main{padding-bottom:32px}

.help{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.help>b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.help ol{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.help ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.help p{margin:8px 0 6px}
.help code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:12px;overflow-wrap:anywhere}
.test-link{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.test-link a{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--blue-ink);font-weight:800;padding:9px 14px;border-radius:12px;text-decoration:none}
.test-link svg.i{width:16px;height:16px}

/* ---------- surplus/defisit, delta, ringkasan budget ---------- */
.hero-row{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero-period{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-2);background:rgba(255,255,255,.6);border-radius:999px;padding:3px 9px}
.hero-chip.sur .dot{background:var(--mint);color:var(--mint-ink)} .hero-chip.sur small,.hero-chip.sur b{color:var(--mint-ink)}
.hero-chip.def .dot{background:var(--red-bg);color:var(--red-ink)} .hero-chip.def small,.hero-chip.def b{color:var(--red-ink)}
@media (max-width:560px){
  .hero-row{gap:8px}
  .hero-chip{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}

  .hero-chip .dot svg.i{width:15px;height:15px}

}
.neg-red{color:var(--red-ink)}
.over-note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.45}
.over-note svg.i{width:16px;height:16px;flex:none;margin-top:1px}
.over-note b{font-weight:800}
.bud-eq{margin-top:14px;background:var(--surface-2);border-radius:var(--r);padding:4px 14px}
.bud-eq>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.bud-eq>div:last-child{border-bottom:0}
.bud-eq span{color:var(--ink-2);font-weight:600}
.bud-eq i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink-3);background:var(--surface);border-radius:6px;padding:1px 5px;margin-left:4px}
.bud-eq b{font-weight:800;white-space:nowrap}
.bud-eq .tot{border-bottom:2px solid var(--line)}
.bud-eq .tot span{color:var(--ink);font-weight:800}

/* ================= Apple HIG layer (iOS 26 / Liquid Glass) ================= */
:root{
  color-scheme:light;
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --bg:#F2F2F7; --surface-2:#EFEFF4; --line:#E5E5EA; --ink:#000000; --ink-2:#3C3C43; --ink-3:#6C6C70;
  --r-lg:20px; --r-xl:24px; --tab-h:64px;
  --glass:rgba(255,255,255,.34); --glass-edge:rgba(255,255,255,.85); --glass-shadow:0 10px 32px -12px rgba(30,40,70,.28),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35); --blur:blur(28px) saturate(200%) brightness(1.04);
  --shadow:0 0 0 .5px rgba(60,60,67,.08); --fill:rgba(118,118,128,.12);
}
body{font-size:16px;line-height:1.4;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.num,.hero-amt,.big-num,.w-amt,.proj-amt,.sal,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3,b,strong{font-weight:600}
.hero-amt,.big-num,.donut .c b,.sum3 b,.bd-tot b,.acc-top .sal,.detail-hero .amt,.amount-line input,.ms b,.proj-amt,.brand,.wallet .w-amt{font-weight:700}
.eyebrow,.hello-sub{font-weight:600}
.card{border:0;box-shadow:var(--shadow)}
svg.i{stroke-width:1.75}
/* Navigation bar: large title -> compact title on scroll, glass when content passes beneath */
.topbar{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;transition:background .2s,box-shadow .2s}
.page-title{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;transition:font-size .2s}
.hello{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scrolled .topbar{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 rgba(60,60,67,.18)}
body.scrolled .page-title{font-size:18px}
body.scrolled .topbar .hello-sub{display:none}
.pill-select,.icon-btn{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.seg{background:var(--fill)}
/* Tab bar: floating glass capsule, inset 16pt, minimizes while scrolling down */
.tabbar{left:16px;right:calc(16px + 60px + 10px);bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow);transition:padding .25s,transform .25s}
.tabbar button{padding:4px 0;font-size:10.5px;font-weight:600;gap:2px;border-radius:999px;color:var(--ink-3)}
.tabbar button .tb{width:100%;height:30px}
.tabbar button[aria-current="page"]{background:var(--fill);color:var(--blue-ink)}
.tabbar button[aria-current="page"] .tb{background:none}
.tabbar.min{padding:3px}.tabbar.min button{font-size:0;gap:0;padding:6px 0}
/* "+" as a separate glass island next to the tab bar */
.fab{right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:60px;height:60px;background:var(--glass);color:var(--blue-ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.fab:hover{transform:none}.fab svg.i{width:26px;height:26px;stroke-width:2.2}
.scrim{backdrop-filter:none;background:rgba(0,0,0,.3)}
.sheet{background:var(--bg)}
@media (min-width:960px){
  .side{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:.5px solid rgba(60,60,67,.14)}
  .fab{right:28px;bottom:28px}
  .page-title{font-size:34px}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass:rgba(255,255,255,.96);--glass-sheet:rgba(255,255,255,.98)}}
@media (prefers-reduced-transparency:reduce){:root{--glass:#fff;--glass-sheet:#fff}.tabbar,.fab,.topbar,.pill-select,.icon-btn,.side{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
/* Catat transaksi / detail sheets: translucent glass, content shows through */
:root{--glass-sheet:rgba(255,255,255,.58);--glass-in:rgba(255,255,255,.42)}
.scrim{background:rgba(20,30,60,.14)}
.sheet{background:var(--glass-sheet);-webkit-backdrop-filter:blur(44px) saturate(210%) brightness(1.05);backdrop-filter:blur(44px) saturate(210%) brightness(1.05);border:.5px solid var(--glass-edge);box-shadow:0 -10px 50px -12px rgba(30,40,70,.35),inset 0 1px 0 rgba(255,255,255,.95)}
:where(.sheet) :is(.acc-chip,.date-field,.text-field,.dl,.card,.seg,.btn-ghost,.chip,.bt-row):not([aria-pressed="true"]){background:var(--glass-in);border-color:rgba(255,255,255,.75)}
:where(.sheet) .cat:not([aria-pressed="true"]) .bub{background:var(--glass-in)}
:where(.sheet) :is(.text-field,.date-field,.acc-chip){border-width:.5px}
/* pilihan terpilih harus jelas terlihat */
.sheet .acc-chip[aria-pressed="true"]{border:2px solid var(--blue-ink);background:var(--blue);box-shadow:0 4px 14px -6px rgba(0,98,204,.5)}
.sheet .acc-chip[aria-pressed="true"] b{color:var(--blue-ink)}
.sheet .chip[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--blue-ink) inset}
.fee-chips{display:flex;gap:8px;flex-wrap:wrap}
.fee-chips .chip{flex:1 1 auto;white-space:nowrap}
.sheet-h{background:transparent}
@media (prefers-reduced-transparency:reduce){.sheet{-webkit-backdrop-filter:none;backdrop-filter:none}}
/* ---- fitur: laporan akun, sortir, pilih beberapa bulan, kartu total aset geser ---- */
.search-row{display:flex;gap:10px;align-items:center}
.search-row .search{flex:1;min-width:0}
.sort-btn{flex:none;width:44px;height:44px;position:relative}
.sort-btn.on{color:var(--blue-ink);background:var(--blue)}
.lnk-ak{text-decoration:underline;text-decoration-color:rgba(60,60,67,.3);text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.lnk-ak:hover{text-decoration-color:currentColor}
.pop{position:fixed;z-index:70;padding:8px;border-radius:22px;overflow:auto;overscroll-behavior:contain;background:var(--glass-sheet);-webkit-backdrop-filter:blur(40px) saturate(210%);backdrop-filter:blur(40px) saturate(210%);border:.5px solid var(--glass-edge);box-shadow:0 18px 50px -14px rgba(30,40,70,.4),inset 0 1px 0 rgba(255,255,255,.9);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .16s,transform .16s;pointer-events:none}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.mp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px 6px;font-size:14px}
.mp-h .faint{font-size:12px;font-weight:600}
.mp-quick{display:flex;gap:8px;padding:2px 6px 8px}
.mp-quick button{flex:1;background:var(--fill);border-radius:999px;padding:9px 10px;font-weight:600;font-size:12.5px;color:var(--blue-ink)}
.mp-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:12px;text-align:left;font-weight:500;font-size:15px}
.mp-row:hover{background:var(--fill)}
.mp-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-3);display:grid;place-items:center;color:transparent;flex:none}
.mp-box svg.i{width:14px;height:14px;stroke-width:3}
.mp-row[aria-checked="true"] .mp-box{background:var(--blue-ink);border-color:var(--blue-ink);color:#fff}
.mp-done{width:100%;height:46px;margin-top:6px}
.tot-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px}
.tot-slides::-webkit-scrollbar{display:none}
.tot-s{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 18px;box-sizing:border-box}
.tot-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.tot-dots i{width:6px;height:6px;border-radius:99px;background:rgba(60,60,67,.25);transition:width .2s,background .2s}
.tot-dots i.on{width:16px;background:var(--blue-ink)}
.ak-hero{border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}

.ak-hero .b-foot{margin-top:6px}
.topbar .grow{min-width:0}
.topbar .page-title,.topbar .hello-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pill-select{flex:none;max-width:60%}
.topbar .pill-select span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* semua kartu memakai radius standar Kartu Estimasi (var(--r-xl) = 24px) */
.card,.wallet,.ins,.sum3 div,.ms,.help,.install-banner,.cal,.dl,.tit-a,.skeleton,.proj,.ak-hero,.hero,.acc-hero{border-radius:var(--r-xl)}
.pop{border-radius:var(--r-xl)}
/* ---- palet khas aplikasi iPhone (Pesan, Telepon, Pengingat, Catatan): tegas tapi tidak mencolok ---- */
.btn-primary{background:#007AFF;color:#fff;box-shadow:0 10px 22px -12px rgba(0,98,204,.75)}

.brand-mark,.side .brand-mark{background:linear-gradient(135deg,#34C759,#007AFF);color:#fff}
.fab{color:#007AFF}
.tabbar button[aria-current="page"]{color:#007AFF}
.sheet .acc-chip[aria-pressed="true"]{background:#EAF3FF;border-color:#007AFF;box-shadow:0 4px 14px -8px rgba(0,122,255,.6)}
.sheet .acc-chip[aria-pressed="true"] b{color:#0A63D1}
.sheet .chip[aria-pressed="true"]{box-shadow:0 0 0 1.5px #007AFF inset}
.meter.over i{background:#FF3B30}
/* ---- pengaturan ---- */
.avatar{border:0;cursor:pointer;padding:0}
.set-grid{display:grid;gap:18px}
@media (min-width:960px){.set-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.set-grid>.card:first-child{grid-row:span 2}}
.set-add{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--blue-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.set-add svg.i{width:16px;height:16px}
.set-grp{margin-top:14px}.set-grp:first-of-type{margin-top:0}
.set-gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.set-gh b{font-size:14px}.set-gh .faint{font-size:12px;font-weight:600}
.set-amt{background:var(--glass-in,var(--surface));border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;height:50px}
.set-amt input{font-size:16px;font-weight:600}
.set-amt .rp{font-size:15px;margin-right:6px}
/* transisi kembali */
@keyframes viewBack{from{opacity:.4;transform:translateX(-26px)}to{opacity:1;transform:none}}
body[data-dir="back"] .view{animation:viewBack .32s ease both}
</style>

<script>
'use strict';
/* RicashFlow — satu file untuk dua mode:
   LIVE  : disajikan oleh Google Apps Script, baca/tulis langsung ke Google Sheet (google.script.run)

/* Saldo per rekening = rumus sheet Rekening: awal + penerimaan − pengeluaran + transfer masuk − transfer keluar */
function balances(upto) {
  const b = {};
  S.data.rek.forEach(a => { b[a.nama] = { ...a, masuk: 0, keluar: 0, tin: 0, tout: 0, n: 0 }; });
  S.data.trx.forEach(t => {
    if (upto && t.d > upto) return;
    const a = b[t.rek];
    if (t.ind === 'penerimaan') { if (a) { a.masuk += t.amt; a.n++; } }
    else if (t.ind === 'pengeluaran') { if (a) { a.keluar += t.amt; a.n++; } }
    else if (t.ind === 'transfer') { if (a) { a.tout += t.amt; a.n++; } if (b[t.akun]) { b[t.akun].tin += t.amt; b[t.akun].n++; } }
  });
  Object.values(b).forEach(a => { a.saldo = a.awal + a.masuk - a.keluar + a.tin - a.tout; a.tp = 0; a.tm = 0; });
  (S.data.titipan || []).forEach(t => { if (upto && t.d && t.d > upto) return; const a = b[t.rek]; if (a) { a.tp += t.plus || 0; a.tm += t.minus || 0; } });
  Object.values(b).forEach(a => { a.raw = a.saldo; a.avail = a.saldo + a.tp - a.tm; a.saldo = a.avail; }); // saldo yang ditampilkan = saldo setelah titipan
  return b;
}
/* Dana Tersedia = rumus Rekening!X11:
   (Mandiri & BRI pakai saldo avail. M, BNI pakai saldo H) − saldo mengendap − X7 (cadangan lain + Utang X5 = titipan+ Mandiri & BRI) */
function danaTersedia(b) {
  const c = cfg(), liq = c.liquid || ['mandiri', 'bri', 'bni'], av = c.availRek || ['mandiri', 'bri'];
  const base = liq.reduce((s, n) => s + (b[n] ? b[n].saldo - (c.mengendap || 0) : 0), 0); // semua rekening memakai saldo setelah titipan
  const utang = av.reduce((s, n) => s + (b[n] ? b[n].tp : 0), 0);
  const cad = c.cadanganLain != null ? c.cadanganLain : (c.cadangan || 0);
  return base - utang - cad;
}
/* Estimasi kelebihan / (kekurangan) dana = New Dashboard!J6:
   Dana tersedia (Rekening!X11) + penerimaan belum terealisasi (F18) − pengeluaran & tabungan belum terealisasi (M18).
   "Belum real." per Nama Akun = MAX(0, budget − realisasi) seperti kolom F dan M di sheet Budget. */
const isCurMonth = m => m !== 'all' && m === ymd(new Date()).slice(0, 7);
function proyeksi(m) {
  if (m === 'all' || isMulti(m)) return null;
  const real = realByAkun(txIn(m)), bud = S.data.budget || {};
  const incAk = new Set(S.data.coa.filter(c => c.induk === 'penerimaan').map(c => c.akun));
  let incLeft = 0, expLeft = 0; const incRows = [], expRows = [];
  Object.entries(bud).forEach(([ak, b]) => {
    b = Number(b) || 0; if (!b) return;
    const left = Math.max(0, b - (real[ak] || 0)); if (!left) return;
    if (incAk.has(ak)) { incLeft += left; incRows.push([ak, left]); } else { expLeft += left; expRows.push([ak, left]); }
  });
  incRows.sort((a, b) => b[1] - a[1]); expRows.sort((a, b) => b[1] - a[1]);

  return { dana, incLeft, expLeft, est: dana + incLeft - expLeft, incRows, expRows };

/* Sisa uang harian = New Dashboard!E8: 1 − realisasi/budget akun "uang harian" */
function uangHarian(m) {
  const b = budgetOf('uang harian') * monthsCount(m); if (!b) return null;
  const r = realByAkun(txIn(m))['uang harian'] || 0, sisa = b - r;
  const res = { b, r, sisa, pct: Math.max(0, 1 - r / b) };
  if (isCurMonth(m)) { const now = new Date(); res.daysLeft = daysIn(now.getFullYear(), now.getMonth() + 1) - now.getDate() + 1; res.perDay = Math.max(0, sisa) / res.daysLeft; }
  return res;
}
const pct1 = v => (Math.round(v * 1000) / 10).toString().replace('.', ',');
/* ---------- titipan & rutin ---------- */
function titipanAkun() {
  const g = {};
  (S.data.titipan || []).forEach(t => {
    const k = t.sumber || '(tanpa nama)';
    const a = g[k] = g[k] || { nama: k, plus: 0, minus: 0, rows: [], rek: new Set() };
    a.plus += t.plus || 0; a.minus += t.minus || 0; a.rows.push(t); a.rek.add(t.rek);

/* cocokkan baris Rutin & Temp dengan transaksi bulan tsb (rekening + induk + akun, lalu catatan / jumlah) */
function rutinStatus(m) {

  const order = R0.map((r, i) => i).sort((a, b) => (R0[b].note ? 1 : 0) - (R0[a].note ? 1 : 0));
  const out = [];
  order.forEach(i => {
    const r = R0[i];
    const hit = list.find(t => !used.has(t.row) && t.rek === r.rek && t.ind === r.ind && t.akun === r.akun &&
      (r.note ? (t.note || '').toLowerCase() === r.note.toLowerCase() : (!t.note || Math.abs(t.amt - r.amt) < 1)));

function budgetOf(akun) { return Number((S.data.budget || {})[akun]) || 0; }

/* realisasi = SUMIFS per Nama Akun pada bulan tsb (sama seperti sheet Budget) */
function realByAkun(list) { const r = {}; list.forEach(t => { r[t.akun] = (r[t.akun] || 0) + t.amt; }); return r; }

function budgetAkunSet() {
  const inc = new Set(S.data.coa.filter(c => c.induk === 'penerimaan').map(c => c.akun));
  const E = new Set(S.data.coa.filter(c => c.induk === 'pengeluaran').map(c => c.akun));

  over.sort((x, y) => (y.r - y.b) - (x.r - x.b));

const demoStore = {

const normTx = tx => ({ d: tx.d, rek: tx.rek, ind: tx.ind, akun: tx.akun, amt: tx.amt, note: tx.note || '', f: tx.expr ? '=' + tx.expr : '' });

  catch (e) { const er = new Error(navigator.onLine === false ? 'Tidak ada koneksi internet.' : 'Apps Script menolak atau tidak menjawab permintaan. Periksa pengaturan deployment.'); er.network = true; throw er; }
  if (!r.ok) throw new Error('Apps Script membalas status ' + r.status + '.');
  let j; try { j = await r.json(); } catch (e) { throw new Error('Balasan Apps Script bukan JSON. Pastikan deployment "Siapa saja" dan URL berakhiran /exec.'); }
  if (!j.ok) throw new Error(j.error || 'Permintaan gagal.');

const api = {
  async load() {
    if (!LIVE) return demoStore.load();
    const d = await gas('getAppData');
    if (MODE === 'api') store.set('rcf-cache', { at: Date.now(), data: d });
    return d;
  },
  async add(tx) {
    if (LIVE) return gas('addTransaction', tx);
    const d = S.data, row = d.trx.reduce((m, t) => Math.max(m, t.row), 1) + 1;
    d.trx.push({ row, ...normTx(tx) }); demoStore.save(); return { data: d, row };
  },
  async update(row, tx, orig) {
    if (LIVE) return gas('updateTransaction', row, tx, orig);
    const d = S.data, i = d.trx.findIndex(t => t.row === row);
    if (i < 0) throw new Error('Transaksi tidak ditemukan.');
    d.trx[i] = { row, ...normTx(tx) }; demoStore.save(); return { data: d, row };
  },
  async remove(row, orig) {
    if (LIVE) return gas('deleteTransaction', row, orig);
    const d = S.data;
    d.trx = d.trx.filter(t => t.row !== row).map(t => t.row > row ? { ...t, row: t.row - 1 } : t);
    demoStore.save(); return { data: d };
  },
  async addMany(list) {
    if (LIVE) return gas('addTransactions', list);
    const d = S.data; let row = d.trx.reduce((m, t) => Math.max(m, t.row), 1); const rows = [];
    list.forEach(tx => { row++; d.trx.push({ row, ...normTx(tx) }); rows.push(row); });
    demoStore.save(); return { data: d, rows };
  },
  async removeMany(items) {
    if (LIVE) return gas('deleteTransactions', items);
    const d = S.data;
    items.slice().sort((a, b) => b.row - a.row).forEach(({ row }) => { d.trx = d.trx.filter(t => t.row !== row).map(t => t.row > row ? { ...t, row: t.row - 1 } : t); });
    demoStore.save(); return { data: d };
  },
  async addTitipan(t) {
    if (LIVE) return gas('addTitipan', t);
    const d = S.data; d.titipan = d.titipan || [];
    const max = (cfg().titipanRows || 11) + 1; let row = 2;
    while (row <= max && d.titipan.some(x => x.row === row)) row++;
    if (row > max) throw new Error('Daftar titipan sudah penuh. Hapus titipan yang sudah selesai dulu.');
    d.titipan.push({ row, d: t.d, ket: t.ket, rek: t.rek, plus: t.arah === '+' ? t.amt : 0, minus: t.arah === '-' ? t.amt : 0, sumber: t.sumber });
    d.titipan.sort((a, b) => a.row - b.row); demoStore.save(); return { data: d, row };
  },
  async addAkun(a) {
    if (LIVE) return gas('addAkun', a);
    const d = S.data; d.coa.push({ induk: a.induk, kat: a.kat, grup: a.grup, akun: a.akun }); demoStore.save(); return { data: d };
  },
  async addRekening(r) {
    if (LIVE) return gas('addRekening', r);
    const d = S.data; d.rek.push({ nama: r.nama, no: r.no || '', awal: Number(r.awal) || 0 });
    if (!d.coa.some(c => c.induk === 'transfer' && c.akun === r.nama)) d.coa.push({ induk: 'transfer', kat: 'rekening', grup: 'rekening', akun: r.nama });
    demoStore.save(); return { data: d };
  },
  async removeTitipan(items) {
    if (LIVE) return gas('deleteTitipan', items);
    const d = S.data, rows = new Set(items.map(x => x.row));
    d.titipan = (d.titipan || []).filter(t => !rows.has(t.row)); demoStore.save(); return { data: d };
  }
};

/* rapikan URL tempelan: spasi, /u/1/ (multi-akun), garis miring akhir */
function normUrl(u) {
  u = (u || '').trim().replace(/\s+/g, '');
  u = u.replace(/\/macros\/u\/\d+\/s\//, '/macros/s/').replace(/\/+$/, '').replace(/\?.*$/, '');
  return u;
}
function urlProblem(u) {
  if (!u) return 'URL aplikasi web belum diisi.';
  if (/script\.google\.com\/(home|d\/)|\/edit/.test(u)) return 'Yang ditempel adalah alamat editor Apps Script. Gunakan URL aplikasi web dari Terapkan → Kelola deployment (berakhiran /exec).';
  if (/\/dev$/.test(u)) return 'URL berakhiran /dev adalah URL uji dan hanya bisa dibuka saat login. Gunakan URL deployment yang berakhiran /exec.';
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) return 'URL harus berbentuk https://script.google.com/macros/s/…/exec (salin dari Terapkan → Kelola deployment).';
  return '';
}
/* fetch biasa gagal → coba no-cors: bila host terjangkau, masalahnya izin akses deployment */
async function diagnose(url) {
  try { await fetch(url + '?api=1&fn=ping', { mode: 'no-cors', cache: 'no-store' }); }
  catch (e) { return { kind: 'net', msg: 'Alamat Apps Script tidak terjangkau. Periksa koneksi internet, lalu pastikan URL disalin lengkap.' }; }
  return { kind: 'access', msg: 'Apps Script terjangkau, tetapi menolak permintaan dari aplikasi. Biasanya pengaturan deployment belum sesuai. Periksa daftar di bawah.' };
}

async function doConnect() {
  const url = normUrl($('#cUrl').value), token = $('#cTok').value.trim();
  const bad = urlProblem(url);
  if (bad) { $('#main').innerHTML = connectView(bad, { url, token }, true); return; }
  if (!token) { $('#main').innerHTML = connectView('Token API belum diisi.', { url, token }); return; }
  const btn = $('#cBtn'); btn.disabled = true; btn.innerHTML = `${ic('refresh-cw')}Menghubungkan…`;
  try {
    const d = await callApi('getAppData', [], { url, token });
    store.set('rcf-api', { url, token }); store.set('rcf-cache', { at: Date.now(), data: d });
    setData(d); S.loading = false; S.syncAt = Date.now(); S.offline = false; S.view = 'home';
    renderShell(); render(); toast('Tersambung');
  } catch (e) {
    store.set('rcf-api', null);
    if (e.network) { const d = await diagnose(url); $('#main').innerHTML = connectView(d.msg, { url, token }, true); return; }
    $('#main').innerHTML = connectView('Gagal tersambung: ' + e.message, { url, token }, /bukan JSON|status/.test(e.message));
  }
}

const NAVSTACK = []; let LAST = null;
function go(view, back) {

function goBack() {

const SORTS = [['new', 'Terbaru'], ['old', 'Terlama'], ['big', 'Nominal terbesar'], ['small', 'Nominal terkecil']];
const sortLabel = () => (SORTS.find(x => x[0] === S.sort) || SORTS[0])[1];
function sortTx(f) {
  const m = S.sort || 'new'; if (m === 'new') return f;
  const c = f.slice();
  if (m === 'old') c.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : x.row - y.row);
  else if (m === 'big') c.sort((x, y) => y.amt - x.amt || (x.d < y.d ? 1 : -1));
  else c.sort((x, y) => x.amt - y.amt || (x.d < y.d ? 1 : -1));

}
const flatSort = () => S.sort === 'big' || S.sort === 'small';
function sortBtn() { return `<button type="button" class="icon-btn sort-btn${S.sort !== 'new' ? ' on' : ''}" data-sortbtn aria-haspopup="menu" aria-label="Urutkan riwayat" title="Urutan: ${sortLabel()}">${ic('arrow-up-down')}</button>`; }

function txBlocks(f, opt = {}) {

    const inc = buf.filter(t => t.ind === 'penerimaan').reduce((x, t) => x + t.amt, 0);
    html += `<div class="day-h"><b>${dRel(cur)}</b><span class="num">${inc ? `<span class="pos">+${rpk(inc)}</span> · ` : ''}${out ? `keluar ${rpk(out)}` : (inc ? '' : `${buf.length} transfer`)}</span></div><div class="tx-list">${buf.map(t => txRow(t, opt)).join('')}</div>`;

function insights(m) {

  if (m !== 'all' && !isMulti(m)) {
    const now = new Date(), isCur = m === `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`, D = isCur ? now.getDate() : 31;
    const prev = [1, 2, 3].map(k => prevMonth(m, k)).filter(pm => +pm.slice(0, 4) === IDX.year);
    if (prev.length) {

  const adm = year.filter(t => t.akun === 'admin bank/cc');

}
let SF = null;
const normNama = v => String(v || '').trim().replace(/\s+/g, ' ').toLowerCase();
function openSetForm(kind) {
  SF = { kind, induk: kind === 'rek' ? null : kind.replace('akun-', ''), grup: null, kat: null, nama: '', grupBaru: '', katBaru: '', no: '', awal: '' };
  renderSetForm(); openSheet('#setSheet');
  setTimeout(() => { const a = $('#sNama'); if (a && matchMedia('(pointer:fine)').matches) a.focus(); }, 320);
}
function renderSetForm() {
  const sh = $('#setSheet'), isRek = SF.kind === 'rek', gs = isRek ? [] : akunGroups(SF.induk);
  const title = isRek ? 'Tambah dompet / rekening' : `Tambah akun ${SF.induk}`;
  const chips = (arr, key, cur) => arr.map(([v, l]) => `<button type="button" class="chip" data-${key}="${esc(v)}" aria-pressed="${cur === v}">${esc(l)}</button>`).join('');
  const cats = [...new Set(gs.map(g => g.kat))];
  const kat = SF.grup && SF.grup !== '__new' ? (gs.find(g => g.grup === SF.grup) || {}).kat : null;
  const body = isRek ? `
      <div><label class="field-l" for="sNama">Nama dompet / rekening</label><input class="text-field" id="sNama" maxlength="40" placeholder="mis. BCA, Dana, ShopeePay" value="${esc(SF.nama)}" autocomplete="off"></div>

      <div><label class="field-l" for="sAwal">Saldo awal <span>opsional</span></label><div class="amount-line set-amt"><span class="rp">Rp</span><input id="sAwal" inputmode="numeric" placeholder="0" value="${esc(SF.awal)}" autocomplete="off"></div></div>`
  : `
      <div><label class="field-l" for="sNama">Nama akun</label><input class="text-field" id="sNama" maxlength="40" placeholder="${SF.induk === 'pengeluaran' ? 'mis. Langganan streaming' : 'mis. Bonus tahunan'}" value="${esc(SF.nama)}" autocomplete="off"></div>
      <div><div class="field-l">Grup</div><div class="chip-row">${chips(gs.map(g => [g.grup, pretty(g.grup)]).concat([['__new', '＋ Grup baru']]), 'sgrup', SF.grup)}</div>
        ${kat ? `<div class="faint" style="font-size:12.5px;font-weight:600;margin-top:8px">Kategori: ${esc(pretty(kat))}</div>` : ''}</div>
      ${SF.grup === '__new' ? `<div><label class="field-l" for="sGrupBaru">Nama grup baru</label><input class="text-field" id="sGrupBaru" maxlength="40" placeholder="mis. Hiburan digital" value="${esc(SF.grupBaru)}" autocomplete="off"></div>
        <div><div class="field-l">Kategori</div><div class="chip-row">${chips(cats.map(c => [c, pretty(c)]).concat([['__new', '＋ Kategori baru']]), 'skat', SF.kat)}</div></div>

  sh.innerHTML = `<div class="grab"></div>

async function saveSetForm() {
  const err = m => { const e = $('#sErr'); e.textContent = m; e.hidden = false; };
  const nama = normNama(SF.nama);
  if (!nama) return err(SF.kind === 'rek' ? 'Isi nama dompet atau rekening.' : 'Isi nama akun.');
  let call, label;
  if (SF.kind === 'rek') {
    if (S.data.rek.some(r => normNama(r.nama) === nama)) return err('Dompet atau rekening dengan nama itu sudah ada.');
    const digits = String(SF.awal).replace(/[^\d]/g, ''), awal = (/^\s*-/.test(SF.awal) ? -1 : 1) * Number(digits || 0);
    call = () => api.addRekening({ nama, no: SF.no.trim(), awal }); label = `${pretty(nama)} ditambahkan`;
  } else {
    if (S.data.coa.some(c => c.induk === SF.induk && normNama(c.akun) === nama)) return err('Akun itu sudah ada.');
    if (!SF.grup) return err('Pilih grup untuk akun ini.');
    let grup = SF.grup, kat;
    if (grup === '__new') {
      grup = normNama(SF.grupBaru); if (!grup) return err('Isi nama grup baru.');
      if (!SF.kat) return err('Pilih kategori untuk grup baru.');
      kat = SF.kat === '__new' ? normNama(SF.katBaru) : SF.kat; if (!kat) return err('Isi nama kategori baru.');
    } else kat = (akunGroups(SF.induk).find(g => g.grup === grup) || {}).kat;
    call = () => api.addAkun({ induk: SF.induk, kat, grup, akun: nama }); label = `Akun ${pretty(nama)} ditambahkan`;
  }
  const btn = $('#sSave'); btn.disabled = true; btn.innerHTML = `${ic('refresh-cw')}Menyimpan…`;
  try { const res = await call(); setData(res.data); closeSheets(); render(); toast(label); }
  catch (e) { btn.disabled = false; btn.innerHTML = `${ic('check')}Simpan`; err(/Fungsi tidak dikenal/.test(e.message || '') ? 'Server belum diperbarui. Tempel Code.gs terbaru di Apps Script, lalu Deploy → Kelola deployment → Edit → Versi baru.' : (e.message || 'Gagal menyimpan.')); }
}
document.addEventListener('submit', e => { if (e.target.id === 'setForm') { e.preventDefault(); saveSetForm(); } });
document.addEventListener('input', e => {
  const t = e.target, k = { sNama: 'nama', sGrupBaru: 'grupBaru', sKatBaru: 'katBaru', sNo: 'no', sAwal: 'awal' }[t.id];
  if (k && SF) SF[k] = t.value;
}, true);

/* geser ke kanan = kembali; tombol kembali Android/browser */
(function () {
  let sx = 0, sy = 0, st = 0, track = false;
  const hScroll = el => { for (let n = el; n && n !== document.body; n = n.parentElement) { const o = getComputedStyle(n).overflowX; if ((o === 'auto' || o === 'scroll') && n.scrollWidth > n.clientWidth + 2) return true; if (n.classList && n.classList.contains('chart')) return true; if (/^(INPUT|TEXTAREA|SELECT)$/.test(n.tagName)) return true; } return false; };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || POP || document.querySelector('.sheet.open')) { track = false; return; }
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); track = sx <= 36 || !hScroll(e.target);
  }, { passive: true });
  addEventListener('touchend', e => {
    if (!track) return; track = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (dx > 90 && Math.abs(dy) < Math.abs(dx) * .5 && Date.now() - st < 700) goBack();
  }, { passive: true });
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (!inFrame && window.history && history.pushState) {
    history.replaceState({ ricash: 0 }, ''); history.pushState({ ricash: 1 }, '');
    addEventListener('popstate', () => {
      if (POP) closePop();
      else if (document.querySelector('.sheet.open')) closeSheets();
      else if (!goBack()) { history.back(); setTimeout(() => history.pushState({ ricash: 1 }, ''), 400); return; }
      history.pushState({ ricash: 1 }, '');
    });
  }
})();
/* ---------- popover (pilih bulan & urutan) ---------- */
let POP = null;
function openPop(anchor, html, kind) {
  closePop();
  const el = document.createElement('div'); el.id = 'pop'; el.className = 'pop'; el.setAttribute('role', 'dialog'); el.innerHTML = html; document.body.appendChild(el);
  POP = { el, anchor, kind, dirty: false };
  const r = anchor.getBoundingClientRect(), w = Math.min(300, innerWidth - 24);
  el.style.width = w + 'px'; el.style.left = Math.min(Math.max(12, r.right - w), innerWidth - w - 12) + 'px'; el.style.top = (r.bottom + 8) + 'px';
  const lim = innerHeight - 96;                       // sisakan ruang untuk tab bar melayang
  el.style.maxHeight = Math.min(lim - 12, 520) + 'px';
  const h = el.offsetHeight; let top = r.bottom + 8;
  if (top + h > lim) top = r.top - 8 - h >= 12 ? r.top - 8 - h : Math.max(12, lim - h);
  el.style.top = top + 'px'; el.style.transformOrigin = (top < r.top ? 'bottom' : 'top') + ' right';
  requestAnimationFrame(() => el.classList.add('open'));
}
function closePop() { if (!POP) return; const d = POP.dirty; POP.el.remove(); POP = null; if (d) render(); }
function mpHTML() {
  const sel = new Set(mset(S.month)); let rows = '';
  for (let mo = IDX.lastMonth; mo >= 1; mo--) { const v = `${IDX.year}-${pad2(mo)}`; rows += `<button type="button" class="mp-row" role="checkbox" aria-checked="${sel.has(v)}" data-mpm="${v}"><span class="mp-box">${ic('check')}</span>${BULAN[mo - 1]} ${IDX.year}</button>`; }
  return `<div class="mp-h"><b>Pilih bulan</b><span class="faint" id="mpCount">${monthLabel(S.month)}</span></div>
    <div class="mp-quick"><button type="button" data-mp="all">Sepanjang ${IDX.year}</button><button type="button" data-mp="last3">3 bulan terakhir</button></div>
    <div class="mp-list">${rows}</div><button type="button" class="btn-primary mp-done" data-mp="done">Selesai</button>`;
}
function setMonthSel(sel) {
  const a = [...sel].sort(); if (!a.length) return;

  if (POP) POP.dirty = true;
  const cur = new Set(mset(S.month));
  $$('#pop .mp-row').forEach(b => b.setAttribute('aria-checked', cur.has(b.dataset.mpm)));
  $$('.pill-select span').forEach(x => { x.textContent = monthLabel(S.month); });
  const c = $('#mpCount'); if (c) c.textContent = monthLabel(S.month);
}
document.addEventListener('click', e => {
  const T = e.target;
  const oa = T.closest('[data-openakun]');
  if (oa) { e.stopImmediatePropagation(); e.preventDefault(); closePop(); closeSheets(); openAkun(oa.dataset.openakun); return; }
  const bk = T.closest('[data-back]');
  if (bk) { e.stopImmediatePropagation(); e.preventDefault(); closePop(); if (!goBack()) go(bk.dataset.back || 'home', true); return; }
  const sa = T.closest('[data-setadd]');
  if (sa) { e.stopImmediatePropagation(); e.preventDefault(); openSetForm(sa.dataset.setadd); return; }
  const sgp = T.closest('[data-sgrup]');
  if (sgp && SF) { e.stopImmediatePropagation(); SF.grup = sgp.dataset.sgrup; if (SF.grup !== '__new') { SF.kat = null; } renderSetForm(); return; }

  const fe = T.closest('[data-fee]');
  if (fe) { e.stopImmediatePropagation(); F.fee = fe.dataset.fee; $$('[data-fee]').forEach(b => { const on = b === fe; b.setAttribute('aria-pressed', on); b.setAttribute('aria-checked', on); }); return; }
  const pk = T.closest('[data-mpick]');

  const sb = T.closest('[data-sortbtn]');
  if (sb) { e.stopImmediatePropagation(); const same = POP && POP.anchor === sb; closePop(); if (!same) openPop(sb, `<div class="mp-h"><b>Urutkan</b></div>` + SORTS.map(([v, l]) => `<button type="button" class="mp-row" role="menuitemradio" aria-checked="${S.sort === v}" data-sortopt="${v}"><span class="mp-box">${ic('check')}</span>${l}</button>`).join(''), 'sort'); return; }
  const so = T.closest('[data-sortopt]');

  const mq = T.closest('[data-mp]');
  if (mq) { e.stopImmediatePropagation(); const a = mq.dataset.mp; if (a === 'all') setMonthSel(new Set(mset('all'))); else if (a === 'last3') setMonthSel(new Set(mset('all').slice(-3))); else closePop(); return; }

document.addEventListener('keydown', e => { if (e.key === 'Escape' && POP) closePop(); });

/* ---------- boot ---------- */
async function load() {
  if (MODE === 'api') {
    if (!apiCfg()) { S.loading = false; renderShell(); render(); return; }
    const c = store.get('rcf-cache');
    if (!S.data && c && c.data) { setData(c.data); S.syncAt = c.at; S.loading = false; renderShell(); render(); }
  }
  S.loading = !S.data; S.err = ''; render();
  try { setData(await api.load()); S.loading = false; S.offline = false; S.syncAt = Date.now(); }
  catch (e) {
    S.loading = false;
    if (MODE === 'api' && S.data) { S.offline = true; toast('Belum bisa memperbarui: ' + e.message); }
    else S.err = 'Data belum bisa dimuat: ' + e.message;
  }
  renderShell(); render();
}
